# Reel diario, paso 2: con la locución ya subida a la release del día (scripts/reel/subir-voz.sh),
# transcribe el audio, calcula los tiempos, graba la web en una pantalla virtual y monta el video.
# El reel.mp4 queda en la release y se avisa en el issue del día para revisarlo y publicarlo.
name: reel-armar

on:
  workflow_dispatch:
    inputs:
      fecha:
        description: "Día del reel (AAAA-MM-DD)"
        required: true

permissions:
  contents: write
  issues: write

concurrency:
  group: reel
  cancel-in-progress: false

defaults:
  run:
    shell: bash  # con -eo pipefail: un paso falla si falla cualquier comando de una tubería

jobs:
  armar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      FECHA: ${{ inputs.fecha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # para saber quién editó por última vez reel-dia.js

      - name: Validar la fecha
        run: '[[ "$FECHA" =~ ^20[0-9]{2}-[01][0-9]-[0-3][0-9]$ ]] || { echo "fecha inválida: $FECHA"; exit 1; }'

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          uv sync --frozen --no-dev
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb fonts-noto-color-emoji >/dev/null

      - name: Bajar el material del día
        run: |
          # en una carpeta aparte, para no ensuciar los archivos versionados de reels/
          mkdir -p material datos "reels/$FECHA"
          gh release download "reel-$FECHA" --dir material --clobber --pattern locucion.mp3 --pattern ahora.txt \
            --pattern guion.json --pattern parana.json --pattern estado.json --pattern serie.json
          test -f material/guion.json || { echo "::error::falta guion.json en la release: corré reel-preparar"; exit 1; }
          test -f material/locucion.mp3 || { echo "::error::falta locucion.mp3: corré scripts/reel/subir-voz.sh"; exit 1; }
          cp material/locucion.mp3 material/ahora.txt material/guion.json "reels/$FECHA/"
          for f in parana estado serie; do if [ -f "material/$f.json" ]; then cp "material/$f.json" datos/; fi; done

      - name: Modelo de transcripción en caché
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Transcribir y calcular tiempos
        run: |
          uv run --no-dev --with faster-whisper --with imageio-ffmpeg python -m alertas.reel tiempos \
            --datos datos --dia "reels/$FECHA" --ahora "$(cat "reels/$FECHA/ahora.txt")"
          cat "reels/$FECHA/reel-dia.js"

      - name: Grabar y montar
        run: |
          FF=$(uv run --no-dev --with imageio-ffmpeg python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          scripts/reel/grabar-ci.sh "reels/$FECHA" datos "$FF" toma.mp4
          scripts/reel/montar.sh toma.mp4 "reels/$FECHA/locucion.mp3" "reels/$FECHA/reel.mp4" "$FF"
          mkdir -p cuadros
          for t in 0 8 12 17 21; do "$FF" -loglevel error -y -ss $t -i "reels/$FECHA/reel.mp4" -frames:v 1 -vf scale=270:-1 cuadros/$t.png; done
          "$FF" -loglevel error -y $(for t in 0 8 12 17 21; do echo -i cuadros/$t.png; done) -filter_complex hstack=inputs=5 "reels/$FECHA/cuadros.png"

      - name: Subir el video a la release
        run: gh release upload "reel-$FECHA" --clobber "reels/$FECHA/reel.mp4" "reels/$FECHA/cuadros.png"

      - name: Guardar los tiempos en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          J="reels/$FECHA/reel-dia.js"
          AUTOR=$(git log -1 --format=%an -- "$J")
          if [ -n "$AUTOR" ] && [ "$AUTOR" != "github-actions[bot]" ]; then
            echo "reel-dia.js del día ya fue editado a mano ($AUTOR): no lo piso"; exit 0
          fi
          git add "$J"
          git commit -m "docs: tiempos del reel del $FECHA" || exit 0
          subido=no
          for i in 1 2 3; do
            if git pull --rebase --autostash && git push; then subido=si; break; fi
            echo "push rechazado, reintento"; sleep 5
          done
          [ "$subido" = si ] || { echo "::error::no pude subir el commit"; exit 1; }

      - name: Avisar en el issue del día
        run: |
          BASE="https://github.com/${{ github.repository }}/releases/download/reel-$FECHA"
          TITULO="Reel del $(date -d "$FECHA" +%d/%m)"
          N=$(gh issue list --label reel --state open --search "in:title \"$TITULO\"" --json number --jq '.[0].number // empty')
          CUERPO="**Video listo para revisar:** [reel.mp4]($BASE/reel.mp4) · [portada]($BASE/portada.png)

          ![cuadros del reel]($BASE/cuadros.png)

          Si está bien, se publica (por ahora a mano desde Chrome, con la portada y la etiqueta de IA)."
          if [ -n "$N" ]; then gh issue comment "$N" --body "$CUERPO"; else echo "$CUERPO"; fi
